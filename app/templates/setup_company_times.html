<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS - Setup Company Times</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">AMS</h1>
            <nav>
                <a href="{{ url_for('admin.dashboard') }}" class="px-2">Dashboard</a>
                <a href="{{ url_for('main.logout') }}" class="px-2">Logout</a>
            </nav>
        </div>
    </header>

    <div class="container mx-auto mt-6 p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-xl font-bold mb-4">Setup {{ company_name }} Attendance Times</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-{{ 'green' if category == 'success' else 'red' }}-100 border border-{{ 'green' if category == 'success' else 'red' }}-400 text-{{ 'green' if category == 'success' else 'red' }}-700 px-4 py-3 rounded relative mb-4" role="alert">
                        <span>{{ message }}</span>
                        <span class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer" onclick="this.parentElement.style.display='none';">×</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label for="check_in_time" class="block text-sm font-medium text-gray-700">Check-In Time (HH:MM):</label>
                <input type="text" name="check_in_time" id="check_in_time" 
                       value="{{ check_in if check_in and ':' in check_in else '10:00' }}" 
                       class="mt-1 block w-full border border-gray-300 rounded-md p-2" 
                       placeholder="e.g., 09:00" pattern="\d{2}:\d{2}" required>
            </div>
            <div>
                <label for="check_out_time" class="block text-sm font-medium text-gray-700">Check-Out Time (HH:MM):</label>
                <input type="text" name="check_out_time" id="check_out_time" 
                       value="{{ check_out if check_out and ':' in check_out else '18:30' }}" 
                       class="mt-1 block w-full border border-gray-300 rounded-md p-2" 
                       placeholder="e.g., 17:30" pattern="\d{2}:\d{2}" required>
            </div>
            <div>
                <label for="required_hours" class="block text-sm font-medium text-gray-700">Required Working Hours:</label>
                <input type="number" name="required_hours" id="required_hours" 
                       value="{{ required_hours if required_hours else '7.0' }}" 
                       class="mt-1 block w-full border border-gray-300 rounded-md p-2" 
                       placeholder="e.g., 8" step="0.1" required>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Save Times</button>
        </form>
    </div>
</body>
</html>
