<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Company - AMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Helvetica, sans-serif;
    }

    body {
      background-color: #1A2526;
      color: #fff;
      padding: 20px;
    }

    /* Navigation Bar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1A2526;
      padding: 10px 20px;
      border-bottom: 1px solid #2C3E50;
    }

    .navbar .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .navbar .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      padding: 5px 10px;
      border-radius: 5px;
    }

    .navbar .nav-links a:hover {
      color: #28A745;
    }

    .navbar .admin-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .navbar .admin-info i {
      color: #fff;
    }

    /* Card Styling */
    .card {
      background-color: #2C3E50;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
    }

    /* Form Styling */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #A0A0A0;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      background-color: #3A4B5C;
      border: none;
      border-radius: 5px;
      color: white;
    }

    .form-group input::placeholder {
      color: #A0A0A0;
    }

    /* Button Styling */
    button {
      background-color: #28A745;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #218838;
    }

    /* Notification Styling */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      z-index: 1000;
      animation: fadeInOut 3s ease-in-out forwards;
    }

    .notification.success {
      background-color: #28A745;
    }

    .notification.error {
      background-color: #DC3545;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(-20px); }
      10% { opacity: 1; transform: translateY(0); }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">AMS - Edit Company</div>
    <div class="nav-links">
      <a href="{{ url_for('super_admin.super_admin') }}"><i class="fas fa-arrow-left"></i> Back to Super Admin</a>
      <a href="{{ url_for('main.logout') }}"><i class="fas fa-sign-out"></i> Logout</a>
    </div>
    <div class="admin-info">
      <i class="fas fa-user-shield"></i>
      <span>Super Admin</span>
    </div>
  </nav>

  <!-- Edit Company Form -->
  <div class="card">
    <h2>Edit Company: {{ company[1] }}</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="notification {{ 'success' if category == 'success' else 'error' }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form action="{{ url_for('company.edit_company', company_id=company[0]) }}" method="POST">
      <div class="form-group">
        <label for="company_name">Company Name</label>
        <input type="text" id="company_name" name="company_name" value="{{ company[1] }}" placeholder="Enter company name" required>
      </div>
      <div class="form-group">
        <label for="company_username">Username</label>
        <input type="text" id="company_username" name="company_username" value="{{ company[2] }}" placeholder="Enter username" required>
      </div>
      <div class="form-group">
        <label for="company_password">Password</label>
        <input type="password" id="company_password" name="company_password" value="{{ company[3] }}" placeholder="Enter password" required>
      </div>
      
      <button type="submit">Save Changes</button>
    </form>
  </div>

  <script>
    // Close notification (if any)
    document.querySelectorAll('.notification .close-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.parentElement.style.display = 'none';
      });
    });
  </script>
</body>
</html>
