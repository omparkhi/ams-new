<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/attendify-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendify - Smart Attendance &amp; Workforce Management Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function() {
          document.body.innerHTML = `
            <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0b0f19; color: #fff; margin: 0; padding: 20px; box-sizing: border-box;">
              <div style="max-width: 560px; background: #131b2e; border: 1px solid #1e293b; border-radius: 16px; padding: 36px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
                <div style="font-size: 42px; margin-bottom: 16px;">🚀</div>
                <h1 style="font-size: 22px; font-weight: 700; margin: 0 0 12px 0; color: #38bdf8;">AMS - Smart Attendance & Student System</h1>
                <p style="color: #94a3b8; font-size: 14px; line-height: 1.6; margin: 0 0 20px 0;">
                  You opened this file directly from the file explorer (<code>file:///</code>). Modern React + Vite applications cannot load their modules directly from disk due to browser security restrictions.
                </p>
                <div style="background: #090d16; border: 1px solid #222f46; border-radius: 10px; padding: 16px; text-align: center; margin-bottom: 20px;">
                  <span style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 8px;">Click below to open the live website:</span>
                  <a href="http://localhost:3000" style="display: inline-block; background: #2563eb; color: #ffffff; padding: 10px 24px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 15px; box-shadow: 0 4px 12px rgba(37,99,235,0.4);">Open http://localhost:3000</a>
                </div>
                <p style="color: #64748b; font-size: 12px; margin: 0;">
                  Or double-click <strong>START_LANDING_PAGE.bat</strong> in this folder to start the server!
                </p>
              </div>
            </div>
          `;
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
