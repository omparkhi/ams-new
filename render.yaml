databases:
  - name: attendify-db
    databaseName: attendify_db
    user: attendify_user
    plan: free
    region: oregon

services:
  # 1. Flask REST API Backend
  - type: web
    name: ams-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_USERNAME
        value: admin
      - key: SUPER_ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_URL
        fromDatabase:
          name: attendify-db
          property: connectionString

  # 2. Vite React Frontend (Modern SaaS UI)
  - type: web
    name: ams-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd ams-landing-page && npm install && npm run build
    staticPublishPath: ams-landing-page/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ams-backend
          property: host
